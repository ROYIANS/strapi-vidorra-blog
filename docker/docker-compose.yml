version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vidorra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vidorra_blog}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vidorra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    container_name: vidorra-server
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vidorra_blog}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
    ports:
      - "3001:3001"
    networks:
      - vidorra-network
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        - NODE_ENV=production
    container_name: vidorra-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://server:3001/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    networks:
      - vidorra-network
    depends_on:
      - server

  admin:
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
      args:
        - NODE_ENV=production
        - VITE_API_URL=${VITE_API_URL:-http://server:3001/api}
    container_name: vidorra-admin
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://server:3001/api}
    ports:
      - "5173:80"
    networks:
      - vidorra-network
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    container_name: vidorra-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - vidorra-network
    depends_on:
      - web
      - admin
      - server
    profiles:
      - with-nginx

networks:
  vidorra-network:
    driver: bridge

volumes:
  postgres_data:
